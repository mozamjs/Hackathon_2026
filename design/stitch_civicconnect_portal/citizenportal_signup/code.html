<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Citizen Complaint Portal - Join Your Community</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-container": "#86f2e4",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#773205",
                        "secondary": "#006a61",
                        "surface-container-highest": "#e0e3e5",
                        "secondary-fixed": "#89f5e7",
                        "on-primary-fixed": "#00164e",
                        "surface": "#f7f9fb",
                        "on-primary-fixed-variant": "#264191",
                        "on-surface": "#191c1e",
                        "tertiary-fixed-dim": "#ffb691",
                        "inverse-surface": "#2d3133",
                        "tertiary-fixed": "#ffdbcb",
                        "primary-fixed": "#dce1ff",
                        "tertiary": "#4b1c00",
                        "outline": "#757682",
                        "on-tertiary-fixed": "#341100",
                        "surface-container": "#eceef0",
                        "on-primary": "#ffffff",
                        "primary-container": "#1e3a8a",
                        "error": "#ba1a1a",
                        "surface-dim": "#d8dadc",
                        "surface-container-high": "#e6e8ea",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#b6c4ff",
                        "surface-variant": "#e0e3e5",
                        "surface-bright": "#f7f9fb",
                        "on-secondary-fixed": "#00201d",
                        "primary": "#00236f",
                        "inverse-on-surface": "#eff1f3",
                        "on-primary-container": "#90a8ff",
                        "surface-tint": "#4059aa",
                        "background": "#f7f9fb",
                        "on-secondary-fixed-variant": "#005049",
                        "on-secondary-container": "#006f66",
                        "on-tertiary-container": "#f39461",
                        "outline-variant": "#c5c5d3",
                        "tertiary-container": "#6e2c00",
                        "surface-container-low": "#f2f4f6",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#b6c4ff",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#6bd8cb",
                        "on-background": "#191c1e",
                        "on-surface-variant": "#444651"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "margin-mobile": "16px",
                        "md": "16px",
                        "lg": "24px",
                        "base": "4px",
                        "sm": "8px",
                        "xs": "4px",
                        "xl": "32px",
                        "gutter": "24px",
                        "container-max": "1280px"
                    },
                    fontFamily: {
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    fontSize: {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],

                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]

                }
            }
        };

<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        .bg-pattern {
            background-color: #f7f9fb;
            background-image: radial-gradient(#e0e3e5 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="h-full bg-surface text-on-surface antialiased bg-pattern flex items-center justify-center p-margin-mobile md:p-lg">
<div class="w-full max-w-md w-full glass-card rounded-xl p-lg md:p-xl animate-fade-in-up">
<!-- Header -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container text-on-primary-container mb-md">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">assured_workload</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-xs">CitizenPortal</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join Your Community</p>
</div>
<!-- Form -->
<form class="space-y-md">
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" id="email" name="email" placeholder="jane.doe@example.com" required="" type="email"/>
</div>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="confirmPassword">Confirm Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant">swipe_left_alt</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:ring-2 focus:ring-primary focus:border-primary transition-shadow" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="pt-md">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors min-h-[44px] items-center" type="submit">
                    Create Account
                </button>
</div>
</form>
<!-- Footer -->
<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Already have an account? 
                <a class="font-label-md text-label-md text-primary hover:underline transition-all" href="#">Login</a>
</p>
</div>
</div>
<script>
        // Simple micro-interaction for input fields
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                const icon = input.previousElementSibling.querySelector('.material-symbols-outlined');
                if (icon) {
                    icon.classList.remove('text-outline-variant');
                    icon.classList.add('text-primary');
                }
            });
            input.addEventListener('blur', () => {
                const icon = input.previousElementSibling.querySelector('.material-symbols-outlined');
                if (icon) {
                    icon.classList.remove('text-primary');
                    icon.classList.add('text-outline-variant');
                }
            });
        });
    </script>
</body></html>
